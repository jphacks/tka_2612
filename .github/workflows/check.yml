# PR ごとに backend / frontend の make check（リント・フォーマット・型）を実行し、
# make gen-api の生成物がコミットされた内容と一致しているかを確かめる
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: make check
      - name: openapi.json が最新か確認
        run: |
          make gen-api
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json が古いままです。backend/ で make gen-api を実行してコミットしてください"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: make check
      - name: API クライアントが最新か確認
        run: |
          make gen-api
          git diff --exit-code -- app/api || {
            echo "::error::API クライアントが古いままです。frontend/ で make gen-api を実行してコミットしてください"
            exit 1
          }
